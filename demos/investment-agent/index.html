<title>투자 비서 Agent · 리서치 채팅 프로토타입</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
<style>
  :root{ --bg:#0b0f19; --card:#121a2b; --text:#e8edf7; --muted:#a9b4c7; --line:#24314e; --accent:#7aa2ff; --accent2:#8bffd0; --warn:#ffd89a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif; font-size:15px; line-height:1.6; display:flex; flex-direction:column; overflow-x:hidden; }
  button{ font:inherit; cursor:pointer; }
  header{ padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
  header h1{ font-size:1rem; margin:0; }
  .notice{ color:var(--muted); font-size:.8rem; }
  #reset{ padding:6px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:transparent; color:var(--muted); font-size:.85rem; }
  #reset:hover{ color:var(--text); }
  .presets{ display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .preset{ padding:7px 12px; border-radius:999px; border:1px solid rgba(122,162,255,.4); background:rgba(122,162,255,.12); color:var(--text); font-size:.88rem; text-align:left; max-width:100%; }
  .preset:disabled{ opacity:.45; cursor:not-allowed; }
  #chat{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .empty{ color:var(--muted); text-align:center; margin:auto; font-size:.9rem; }
  .msg-user{ align-self:flex-end; max-width:80%; background:rgba(122,162,255,.22); padding:9px 13px; border-radius:14px 14px 4px 14px; overflow-wrap:anywhere; }
  .sys{ align-self:flex-start; color:var(--accent2); font-size:.85rem; display:flex; align-items:center; gap:8px; }
  .sys::before{ content:""; flex:none; width:7px; height:7px; border-radius:50%; background:var(--accent2); }
  .card{ border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03); border-radius:12px; padding:10px 12px; font-size:.88rem; overflow-wrap:anywhere; }
  .card summary{ cursor:pointer; font-weight:600; }
  .card .label{ color:var(--accent); font-weight:600; margin-top:8px; font-size:.82rem; }
  .card ul{ margin:4px 0 0; padding-left:18px; color:var(--muted); }
  .ledger .head{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:4px; }
  .ledger .step{ color:var(--muted); font-size:.78rem; }
  .ledger .agent{ font-weight:700; color:var(--accent); }
  .badge{ font-size:.72rem; padding:1px 8px; border-radius:999px; border:1px solid rgba(139,255,208,.35); color:var(--accent2); white-space:nowrap; }
  .badge.warn{ border-color:rgba(255,216,154,.45); color:var(--warn); }
  .ledger.blocked{ border-color:rgba(255,216,154,.4); }
  .ledger .result{ color:var(--muted); margin-top:4px; font-size:.84rem; }
  .ledger .result::before{ content:"↳ "; }
  .urls{ display:flex; flex-wrap:wrap; gap:6px; }
  .url{ font-size:.78rem; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chart{ border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:10px; background:#0d1424; }
  .chart .cap{ font-size:.8rem; color:var(--muted); margin-bottom:4px; }
  .chart svg{ width:100%; max-width:640px; height:auto; display:block; margin:0 auto; }
  .answer{ background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:12px 14px; overflow-wrap:anywhere; }
  .answer h3{ font-size:1rem; margin:.5em 0 .3em; }
  .answer p{ margin:.4em 0; }
  .answer ul{ margin:.3em 0; padding-left:20px; }
  .answer blockquote{ margin:.6em 0 0; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); font-size:.85rem; }
  .answer.streaming::after{ content:"▍"; color:var(--accent); }
</style>
</head>

    timers.push(t);
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function append(node) {
    const empty = chat.querySelector('.empty');
    if (empty) empty.remove();
    chat.appendChild(node);
    chat.scrollTop = chat.scrollHeight;
    return node;
  }

    const ul = el('ul');
    items.forEach((t) => ul.appendChild(el('li', null, t)));

  function lineChart({ title, labels, series, unit }) {
    const W = 560, H = 230, P = { l: 46, r: 14, t: 24, b: 28 };
    const all = series.flatMap((s) => s.values);
    const min = Math.min(...all), max = Math.max(...all), span = (max - min) || 1;
    const x = (i) => P.l + (i * (W - P.l - P.r)) / (labels.length - 1);
    const y = (v) => P.t + (1 - (v - min) / span) * (H - P.t - P.b);
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', title);
    const add = (tag, attrs, text) => {
      const n = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
      if (text != null) n.textContent = text;
      svg.appendChild(n);
      return n;
    };
    for (let k = 0; k <= 4; k += 1) {
      const v = min + (span * k) / 4;
      const yy = y(v);
      add('line', { x1: P.l, x2: W - P.r, y1: yy, y2: yy, stroke: '#24314e', 'stroke-width': 1 });
      add('text', { x: P.l - 6, y: yy + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#a9b4c7' }, `${v.toFixed(0)}${unit}`);
    }
    [0, Math.floor((labels.length - 1) / 2), labels.length - 1].forEach((i) => {
      add('text', { x: x(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 10, fill: '#a9b4c7' }, labels[i]);
    });
    series.forEach((s, si) => {
      add('polyline', { points: s.values.map((v, i) => `${x(i)},${y(v)}`).join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2 });
      add('rect', { x: P.l + si * 110, y: 6, width: 12, height: 4, fill: s.color });
      add('text', { x: P.l + 16 + si * 110, y: 11, 'font-size': 10, fill: '#e8edf7' }, s.name);
    });
    return svg;
  }

  const RENDER = {
    user: (ev, id, scenario) => append(el('div', 'msg-user', scenario.label)),
    system: (ev) => append(el('div', 'sys', ev.text)),
    plan: (ev) => {
      const card = el('details', 'card plan');
      card.open = true;
      card.appendChild(el('summary', null, 'Facts Survey · Plan'));
      card.appendChild(el('div', 'label', 'Facts Survey'));
      card.appendChild(list(ev.facts));
      card.appendChild(el('div', 'label', 'Plan'));
      card.appendChild(list(ev.plan));
      append(card);
    },
    ledger: (ev) => {
      const card = el('div', `card ledger${ev.blocked ? ' blocked' : ''}`);
      const head = el('div', 'head');
      head.appendChild(el('span', 'step', `Progress Ledger #${ev.step}`));
      head.appendChild(el('span', 'agent', ev.agent));
      ev.badges.forEach((b) => head.appendChild(el('span', `badge${ev.blocked ? ' warn' : ''}`, b)));
      card.appendChild(head);
      card.appendChild(el('div', 'instr', ev.instruction));
      append(card);
    },
    result: (ev) => {
      const cards = chat.querySelectorAll('.ledger');
      const last = cards[cards.length - 1];
      if (last) last.appendChild(el('div', 'result', ev.text));
      chat.scrollTop = chat.scrollHeight;
    },
    urls: (ev) => {
      const wrap = el('div', 'urls');
      ev.items.forEach((t) => wrap.appendChild(el('span', 'url', `🔗 ${t}`)));
      append(wrap);
    },
    chart: (ev) => {
      const box = el('div', 'chart');
      box.appendChild(el('div', 'cap', `📈 ${ev.title}`));
      box.appendChild(lineChart(ev));
      append(box);
    },
    answer: (ev) => {
      streams.set(ev, append(el('div', 'answer streaming')));
    },
  };

  // 스트리밍 청크는 play()가 절대 시각으로 미리 예약한다. 타이머를 체인으로 잇지 않아야
  // 브라우저의 중첩 타이머 최소 지연(4ms)이 누적되지 않고, 종료 시각이 계산과 일치한다.
  function streamTo(ev, shown) {
    const box = streams.get(ev);
    if (!box) return;
    const part = ev.text.slice(0, shown);
    if (window.marked) box.innerHTML = window.marked.parse(part);
    else box.textContent = part;
    chat.scrollTop = chat.scrollHeight;
    if (shown >= ev.text.length) box.classList.remove('streaming');
  }

  function setPresetsDisabled(disabled) {
    presets.querySelectorAll('.preset').forEach((b) => { b.disabled = disabled; });
  }

  function reset() {
    runId += 1;
    timers.forEach(clearTimeout);
    timers = [];
    streams.clear();
    chat.innerHTML = '';
    chat.appendChild(el('div', 'empty', EMPTY_TEXT));
    document.body.dataset.state = 'idle';
    setPresetsDisabled(false);
  }

  function play(scenario) {
    if (document.body.dataset.state === 'running') return;
    reset();
    const id = runId;
    document.body.dataset.state = 'running';
    setPresetsDisabled(true);
    let t = 0;
    scenario.events.forEach((ev) => {
      t += ev.delay ?? 600;
      later(() => RENDER[ev.type](ev, id, scenario), t, id);
      if (ev.type === 'answer') {
        const steps = Math.ceil(ev.text.length / STREAM_CHUNK);
        for (let k = 1; k <= steps; k += 1) {
          const shown = Math.min(ev.text.length, k * STREAM_CHUNK);
          later(() => streamTo(ev, shown), t + k * STREAM_TICK, id);
        }
        t += steps * STREAM_TICK;
      }
    });
    later(() => {
      document.body.dataset.state = 'done';
      setPresetsDisabled(false);
    }, t + 200, id);
  }

  SCENARIOS.forEach((s) => {
    const b = el('button', 'preset', s.label);
    b.type = 'button';
    b.dataset.scenario = s.id;
    b.addEventListener('click', () => play(s));
    presets.appendChild(b);
  });
  resetBtn.addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
